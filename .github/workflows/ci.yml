name: My App Manager Workflow

on:
  push:
    branches: [ "development" ]
env:
  BUNDLE_DIR: "app/build/outputs/bundle/release"
  APK_DIR: "app/build/outputs/apk/release"

jobs:
  build:
    env:
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      KEYSTORE_FILE_B64_STRING: ${{ secrets.KEYSTORE_BASE_64 }}
    runs-on: ubuntu-latest
#    outputs:
#      apk-file-path: ${{ steps.releaseApk.outputs.apkfile }}
#      aab-file-path: ${{ steps.releaseAab.outputs.aabfile }}
    steps:
      - name: checking out
        uses: actions/checkout@v3
      - name: set up jdk
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: setup gradle
        uses: gradle/gradle-build-action@v2

      - name: making gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore b64 string to file

        run: |
          echo $KEYSTORE_FILE_B64_STRING > keystore-b64.txt
          base64 -d keystore-b64.txt > keystore.jks

      - name: Build release apk
        run: ./gradlew assembleRelease --stacktrace

#      - name: Build release bundle
#        run:  ./gradlew bundleRelease --stacktrace

#      - name: Check release aab exist
#        #id: releaseAab
#        run: ls $BUNDLE_DIR/*apk
#        #run: echo "aabfile=$(find app/build/outputs/bundle/release/*.aab)" >> $GITHUB_OUTPUT

      - name: Check release apk exist
        #id: releaseApk
        run: ls ${{env.APK_DIR}}/*apk
        #run: echo "apkfile=$(find app/build/outputs/apk/release/*.apk)" >> $GITHUB_OUTPUT

      - name: Upload app apk as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{env.APK_DIR}}/app-release.apk
          #path: $APK_DIR/app-release.apk

#      - name: Upload app bundle as artifact
#        uses: actions/upload-artifact@v4
#        with:
#          name: app-bundle
#          path: ${{ steps.releaseAab.outputs.aabfile }}

  deploy-firebase-distribution:
    runs-on: ubuntu-latest
    needs: build
    steps:
#      - name: print app release files paths
#        run: |
#          echo "APK file path: ${{ needs.build.outputs.apk-file-path}}"
#          echo "AAB file path: ${{ needs.build.outputs.aab-file-path }}"

      - name: Download app APK from artifact
        uses: actions/download-artifact@v4
        with:
          name: app-apk
          path: ${{env.APK_DIR}}
          #path: app/build/outputs/apk/release



      - name: upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{secrets.FIREBASE_APP_ID}}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: ${{env.APK_DIR}}/app-release.apk
          #file: ${{ needs.build.outputs.apk-file-path }}

