name: appmanager ci

on:
  push:
    branches: [ "development" ]


jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk-file-path: ${{ steps.releaseApk.outputs.apkfile }}
      aab-file-path: ${{ steps.releaseAab.outputs.aabfile }}
    steps:
      - name: checking out
        uses: actions/checkout@v3
      - name: set up jdk
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: setup gradle
        uses: gradle/gradle-build-action@v2

      - name: making gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE_64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

        #run: |
          #TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}"/keystore
          #mkdir "${TMP_KEYSTORE_FILE_PATH}"
          #echo $ENCODED_STRING | base64 -di > "${TMP_KEYSTORE_FILE_PATH}"/keystore.jks

        run: |
          echo $ENCODED_STRING > keystore-b64.txt
          base64 -d keystore-b64.txt > keystore.jks

      - name: Build Release Apk
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Build Release Bundle
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        #run: ./gradlew assemble
        run:  ./gradlew bundleRelease --stacktrace

      - name: Get release file aab path
        id: releaseAab
        run: echo "aabfile=$(find app/build/outputs/bundle/release/*.aab)" >> $GITHUB_OUTPUT

      - name: Get release file apk path
        id: releaseApk
        run: echo "apkfile=$(find app/build/outputs/apk/release/*.apk)" >> $GITHUB_OUTPUT

      - name: Upload app apk as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ steps.releaseApk.outputs.apkfile }}

      - name: Upload app bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: ${{ steps.releaseAab.outputs.aabfile }}



      #- name: print results
        #run: |
          #echo "APK file path: ${{ steps.releaseApk.outputs.apkfile }}"
          #echo "AAB file path: ${{ steps.releaseAab.outputs.aabfile }}"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: print results
        run: |
          echo "APK file path: ${{ needs.build.outputs.apk-file-path}}"
          echo "AAB file path: ${{ needs.build.outputs.aab-file-path }}"

      - name: Download app bundle from artifact
        uses: actions/download-artifact@v4
        with:
          name: app-apk

      - name: upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{secrets.FIREBASE_APP_ID}}
          serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
          groups: testers
          #file: ${{ steps.releaseApk.outputs.apkfile }}
          #file: ${{ needs.build.outputs.apk-file-path }}
          file: '${{ github.workspace }}/app-release.aab'